name: Security Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast-codebase-audit:
    name: SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy pytest detect-secrets pylint

      - name: Run Full SAST Security Audit
        run: |
          python control_plane.py audit codebase --level full

  secret-scanning:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy pytest detect-secrets pylint

      - name: Scan for Hardcoded Secrets
        run: |
          detect-secrets scan --all-files

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  gate-result:
    name: Gate Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - sast-codebase-audit
      - secret-scanning
    steps:
      - name: Check Required Jobs
        run: |
          SAST="${{ needs.sast-codebase-audit.result }}"
          SECRETS="${{ needs.secret-scanning.result }}"

          if [ "$SAST" != "success" ]; then
            echo "❌ SAST Audit failed (result: $SAST)"
            exit 1
          fi

          if [ "$SECRETS" != "success" ]; then
            echo "❌ Secret Scan failed (result: $SECRETS)"
            exit 1
          fi

          echo "✅ Security Gate passed (sast=$SAST, secrets=$SECRETS)"
