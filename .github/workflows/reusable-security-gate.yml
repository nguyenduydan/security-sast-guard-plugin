name: Security Gate

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-codebase-audit:
    name: SAST Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv pip install --system -e .

      - name: Run Full SAST Security Audit & Generate SARIF
        run: |
          python control_plane.py audit codebase --level full --sarif results.sarif

      - name: Upload SAST SARIF Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-sarif-report
          path: results.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: security-sast-guard

  secret-scanning:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv pip install --system detect-secrets

      - name: Scan for Hardcoded Secrets against Baseline
        run: |
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  gate-result:
    name: Gate Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - sast-codebase-audit
      - secret-scanning
    steps:
      - name: Check Required Jobs
        run: |
          SAST="${{ needs.sast-codebase-audit.result }}"
          SECRETS="${{ needs.secret-scanning.result }}"

          if [ "$SAST" != "success" ]; then
            echo "❌ SAST Audit failed (result: $SAST)"
            exit 1
          fi

          if [ "$SECRETS" != "success" ]; then
            echo "❌ Secret Scan failed (result: $SECRETS)"
            exit 1
          fi

          echo "✅ Security Gate passed (sast=$SAST, secrets=$SECRETS)"
