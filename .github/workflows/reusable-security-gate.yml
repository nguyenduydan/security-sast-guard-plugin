name: Security Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast-codebase-audit:
    name: SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@39cd14742d08025d6053865ea99933f070b40e4e # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy pytest detect-secrets pylint

      - name: Run Full SAST Security Audit
        run: |
          python control_plane.py audit codebase --level full

  secret-scanning:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@39cd14742d08025d6053865ea99933f070b40e4e # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy pytest detect-secrets pylint

      - name: Scan for Hardcoded Secrets
        run: |
          detect-secrets scan --all-files

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@5a2ee3f344d6735e5d36e26715ae6aaefae9cfa8 # v4.5.0
        with:
          fail-on-severity: high
