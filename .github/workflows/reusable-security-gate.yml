name: Security Gate

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-gate:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Scan for Hardcoded Secrets
        run: |
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Run Full SAST Security Audit & Generate SARIF
        run: |
          python control_plane.py audit codebase --level full --sarif results.sarif

      - name: Upload SAST SARIF Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-sarif-report
          path: results.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: security-sast-guard
