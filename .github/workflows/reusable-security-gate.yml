name: Reusable Security Gate Audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast-codebase-audit:
    name: SAST Codebase Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Full SAST Security Audit
        run: |
          python control_plane.py audit codebase --level full

  secret-scanning:
    name: Secret & Credential Leak Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Scan for Hardcoded Secrets
        run: |
          detect-secrets scan --all-files

  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@5a2ee3f344d6735e5d36e26715ae6aaefae9cfa8 # v4.5.0
        with:
          fail-on-severity: high
