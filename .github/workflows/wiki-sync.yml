name: Sync Docs to GitHub Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Clone and Sync GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Target GitHub Wiki git repository URL
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          echo "Attempting to clone GitHub Wiki repository..."
          if git clone "$WIKI_URL" wiki-repo; then
            cd wiki-repo

            # Clean existing markdown files at root level
            find . -maxdepth 1 -name "*.md" -delete

            # Copy all files from docs/wiki/
            cp -r ../docs/wiki/* .

            # Check for changes to commit
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "docs(wiki): auto-sync documentation from docs/wiki/ [skip ci]"
              git push origin master || git push origin main
              echo "Successfully synced docs/wiki to GitHub Wiki."
            else
              echo "No changes detected in wiki documentation. Sync skipped."
            fi
          else
            echo "::warning::GitHub Wiki repository not found or Wiki feature is disabled. Enable Wikis in repository Settings -> Features -> Wikis."
          fi
