name: Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  manifest-check:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@39cd14742d08025d6053865ea99933f070b40e4e # v5.3.0
        with:
          python-version: "3.12"

      - name: Verify Manifest Version Match
        run: |
          python -c "import json; p=json.load(open('plugin.json')); e=json.load(open('gemini-extension.json')); assert p['version'] == e['version'], f'Mismatch: {p[\"version\"]} vs {e[\"version\"]}'"

  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Ruff Linter & Formatter Check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Pylint Analysis
        run: |
          python -m pylint control_plane.py hooks/run_audit_hook.py scripts/md_to_json.py src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Mypy Type Checker
        run: |
          python -m mypy --config-file=pyproject.toml control_plane.py src/

  pytest-suite:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Pytest Suite
        run: |
          python -m pytest
