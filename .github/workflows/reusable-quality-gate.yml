name: Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality & Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Verify Manifest Version Match
        run: |
          python -c "import json; p=json.load(open('plugin.json')); e=json.load(open('gemini-extension.json')); assert p['version'] == e['version']"

      - name: Run Ruff Linter & Formatter Check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Pylint Analysis
        run: |
          python -m pylint control_plane.py src/

      - name: Run Mypy Type Checker
        run: |
          python -m mypy --config-file=pyproject.toml control_plane.py src/

      - name: Run Pytest Suite
        run: |
          python -m pytest

  cross-platform-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Run Pytest Suite
        run: |
          python -m pytest
