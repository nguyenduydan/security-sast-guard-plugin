name: Release SBOM

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Git Tag Name (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-package-attest:
    name: Package & Attest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Release Notes File
        id: notes
        run: |
          if [ -f "docs/releases/${{ inputs.tag_name }}.md" ]; then
            echo "path=docs/releases/${{ inputs.tag_name }}.md" >> $GITHUB_OUTPUT
          elif [ -f "CHANGELOG.md" ]; then
            echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Package Release Asset
        run: |
          git archive \
            --format=zip \
            --prefix=security-sast-guard/ \
            --output=${{ inputs.tag_name }}.zip \
            HEAD -- \
            plugin.json \
            gemini-extension.json \
            control_plane.py \
            hooks.json \
            install.ps1 \
            update.ps1 \
            remove.ps1 \
            install.sh \
            update.sh \
            remove.sh \
            commands \
            hooks \
            rules \
            skills \
            src

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum ${{ inputs.tag_name }}.zip > checksums.txt

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: "spdx-json"
          output-file: "spdx.json"

      - name: Attest Build Provenance (OIDC Cryptographic Attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ inputs.tag_name }}.zip"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ inputs.tag_name }}.zip
            checksums.txt
            spdx.json
          generate_release_notes: true
          draft: false
          prerelease: false
