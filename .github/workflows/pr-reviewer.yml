name: Antigravity AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-pr-review:
    name: AI Security & Clean Code Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Repository (Full History for Diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Install AI Dependencies (Optional)
        run: |
          pip install -e ".[ai]" || true

      - name: Run Antigravity AI PR Review
        run: |
          python scripts/pr_reviewer.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload PR Review Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-report
          path: reports/pr_review_report.md
          if-no-files-found: ignore
