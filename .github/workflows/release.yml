name: Automated Release & Tagging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-gh:
    name: Create Official GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author Identity
        run: |
          git config --global user.name "fogvn"
          git config --global user.email "dn135897@gmail.com"

      - name: Determine Release Notes File
        id: notes
        run: |
          if [ -f "docs/releases/${{ github.ref_name }}.md" ]; then
            echo "path=docs/releases/${{ github.ref_name }}.md" >> $GITHUB_OUTPUT
          elif [ -f "CHANGELOG.md" ]; then
            echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Package Release Asset
        run: |
          # Create a clean zip excluding .git and github workflows
          git archive --format=zip --output=${{ github.ref_name }}.zip HEAD
          
      - name: Generate Checksum
        run: |
          sha256sum ${{ github.ref_name }}.zip > checksums.txt
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ github.ref_name }}.zip
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  release-please:
    name: Release Please PR Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable Auto-merge for Release PR
        if: ${{ steps.release.outputs.pr }}
        run: gh pr merge --auto --merge "${{ fromJson(steps.release.outputs.pr).number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
