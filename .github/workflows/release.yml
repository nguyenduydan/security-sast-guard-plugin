name: Enterprise Automated Release & Tagging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  security-gate:
    name: Mandatory Pre-Release Security Audit
    uses: ./.github/workflows/reusable-security-gate.yml

  release-package-sbom:
    name: Release Asset & SBOM Attestation
    needs: [security-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/reusable-release-sbom.yml
    with:
      tag_name: ${{ github.ref_name }}

  release-please:
    name: Release Please PR Automation
    needs: [security-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7578016895d567d602754607 # v4.1.3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
