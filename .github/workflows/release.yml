name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:
  security-gate:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Scan for Hardcoded Secrets
        run: |
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Run Full SAST Security Audit
        run: |
          python control_plane.py audit codebase --level full

  release-please:
    name: Release PR
    needs: [security-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-package-sbom:
    name: Package & Attest (SBOM)
    needs: [security-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git Author Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Release Notes File
        id: notes
        run: |
          if [ -f "docs/releases/${{ github.ref_name }}.md" ]; then
            echo "path=docs/releases/${{ github.ref_name }}.md" >> $GITHUB_OUTPUT
          elif [ -f "CHANGELOG.md" ]; then
            echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Package Release Asset
        run: |
          git archive \
            --format=zip \
            --prefix=security-sast-guard/ \
            --output=${{ github.ref_name }}.zip \
            HEAD -- \
            plugin.json \
            gemini-extension.json \
            control_plane.py \
            hooks.json \
            install.ps1 \
            update.ps1 \
            remove.ps1 \
            install.sh \
            update.sh \
            remove.sh \
            commands \
            hooks \
            rules \
            skills \
            src

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum ${{ github.ref_name }}.zip > checksums.txt

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: "spdx-json"
          output-file: "spdx.json"

      - name: Attest Build Provenance (OIDC Cryptographic Attestation)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "${{ github.ref_name }}.zip"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ github.ref_name }}.zip
            checksums.txt
            spdx.json
          generate_release_notes: true
          draft: false
          prerelease: false
