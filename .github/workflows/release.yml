name: Automated Release & Tagging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-gh:
    name: Create Official GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author Identity
        run: |
          git config --global user.name "fogvn"
          git config --global user.email "dn135897@gmail.com"

      - name: Determine Release Notes File
        id: notes
        run: |
          if [ -f "docs/releases/${{ github.ref_name }}.md" ]; then
            echo "path=docs/releases/${{ github.ref_name }}.md" >> $GITHUB_OUTPUT
          elif [ -f "CHANGELOG.md" ]; then
            echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Package Release Asset
        run: |
          # Package only runtime files. Keep the top-level directory expected
          # by install.ps1/update.ps1 while excluding source/docs/dev files.
          git archive \
            --format=zip \
            --prefix=security-sast-guard/ \
            --output=${{ github.ref_name }}.zip \
            HEAD -- \
            plugin.json \
            gemini-extension.json \
            control_plane.py \
            hooks.json \
            install.ps1 \
            update.ps1 \
            remove.ps1 \
            commands \
            hooks \
            rules \
            skills \
            src
          
      - name: Generate Checksum
        run: |
          sha256sum ${{ github.ref_name }}.zip > checksums.txt
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ github.ref_name }}.zip
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  release-please:
    name: Release Please PR Automation
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # NOTE: Release PRs created by release-please must be merged MANUALLY by the repo owner.
      # Auto-merge is intentionally disabled to avoid uncontrolled version bumps.
