name: CI

on:
  push:
    branches: [main, develop, 'release/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, develop, 'release/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality-gate:
    name: Quality & Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Verify Manifest Version Match
        run: |
          python -c "import json; p=json.load(open('plugin.json')); e=json.load(open('gemini-extension.json')); assert p['version'] == e['version']"

      - name: Run Ruff Linter & Formatter Check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Pylint Analysis
        run: |
          python -m pylint control_plane.py src/

      - name: Run Mypy Type Checker
        run: |
          python -m mypy --config-file=pyproject.toml control_plane.py src/

      - name: Run Pytest Suite
        run: |
          python -m pytest

  security-gate:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Scan for Hardcoded Secrets
        run: |
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Run Full SAST Security Audit & Generate SARIF
        run: |
          python control_plane.py audit codebase --level full --sarif results.sarif

      - name: Upload SAST SARIF Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-sarif-report
          path: results.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: security-sast-guard

  cross-platform-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Run Pytest Suite
        run: |
          python -m pytest
