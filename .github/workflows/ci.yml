name: CI

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop, 'release/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/reusable-quality-gate.yml

  security-gate:
    name: Security Gate
    uses: ./.github/workflows/reusable-security-gate.yml
