name: Enterprise Security CI Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop, 'release/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code Quality Gate
    uses: ./.github/workflows/reusable-quality-gate.yml

  security-gate:
    name: Security & Vulnerability Audit Gate
    uses: ./.github/workflows/reusable-security-gate.yml

  ci-status-gate:
    name: Final CI Status Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality-gate
      - security-gate
    permissions:
      contents: read
    steps:
      - name: Verify All Reusable Workflows Passed
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ] || \
             [ "${{ needs.security-gate.result }}" != "success" ]; then
            echo "One or more required CI security/quality gates failed!"
            exit 1
          fi
          echo "All Enterprise Security & Quality Gates passed successfully."
