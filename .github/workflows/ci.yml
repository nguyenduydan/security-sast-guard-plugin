name: CI

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop, 'release/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality-gate:
    name: Quality Check
    uses: ./.github/workflows/reusable-quality-gate.yml

  security-gate:
    name: Security Check
    uses: ./.github/workflows/reusable-security-gate.yml

  ci-status-gate:
    name: Status Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality-gate
      - security-gate
    permissions:
      contents: read
    steps:
      - name: Verify All Gates Passed
        run: |
          QUALITY="${{ needs.quality-gate.result }}"
          SECURITY="${{ needs.security-gate.result }}"

          if [ "$QUALITY" != "success" ]; then
            echo "❌ Quality Gate failed (result: $QUALITY)"
            exit 1
          fi

          if [ "$SECURITY" != "success" ] && [ "$SECURITY" != "skipped" ]; then
            echo "❌ Security Gate failed (result: $SECURITY)"
            exit 1
          fi

          echo "✅ All CI Gates passed (quality=$QUALITY, security=$SECURITY)"
